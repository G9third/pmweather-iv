name: Correct 0.12 CurseForge release link

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-curseforge-release-link.yml']

permissions:
  contents: write

jobs:
  fix-release-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the broken CurseForge URL in the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.12 --json body --jq '.body' > /tmp/pmiv-release-body.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/pmiv-release-body.md')
          old = 'https://www.curseforge.com/minecraft/mc-mods/pmweather-aeronautics-compat/files/9114809'
          new = 'https://www.curseforge.com/minecraft/mc-mods/pmweather-aeronautics-compat'
          body = p.read_text()
          if old not in body and new not in body:
              raise RuntimeError('Expected CurseForge URL not found; release unchanged')
          p.write_text(body.replace(old, new))
          PY
          gh release edit v0.12 --notes-file /tmp/pmiv-release-body.md
