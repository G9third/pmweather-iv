name: Sync v0.12 release notes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-release-0.12-notes.yml']

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub release text only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.12 --notes-file docs/RELEASE-0.12.md
