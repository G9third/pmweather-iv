name: Publish stable 0.12

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-0.12.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'G9third/pmweather-iv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download authorized, hash-verified compile dependencies
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, zipfile
          libs = pathlib.Path('libs')
          manifest = json.loads((libs/'DEPENDENCIES.json').read_text())
          files = {x['filename']: x for x in manifest['files']}
          agent = {'User-Agent': 'PMWeather-IV-build/0.12 (compile dependencies only)'}
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=agent), timeout=120) as r:
                  return r.read(128 * 1024 * 1024 + 1)
          def save(name, data):
              entry = files[name]
              if len(data) != entry['bytes']:
                  raise RuntimeError(f'{name}: unexpected byte size {len(data)}')
              digest = hashlib.sha256(data).hexdigest()
              if digest != entry['sha256']:
                  raise RuntimeError(f'{name}: SHA-256 mismatch {digest}')
              (libs/name).write_bytes(data)
              print(f'Verified {name} ({digest})')
          def modrinth(version_id, filename):
              data = json.loads(fetch('https://api.modrinth.com/v2/version/'+version_id))
              expected = files[filename]['sha256']
              candidates = [x for x in data['files'] if (x.get('hashes',{}).get('sha256') == expected or (x.get('filename') == filename and x.get('size') == files[filename]['bytes']))]
              if not candidates:
                  print('Available official files:', [(x.get('filename'), x.get('size'), x.get('hashes',{}).get('sha256')) for x in data['files']], flush=True)
                  raise RuntimeError('No byte-identical authorized Modrinth artifact for '+filename)
              save(filename, fetch(candidates[0]['url']))
          save('Immersive Vehicles-1.21.1-24.0.0.jar', fetch('https://edge.forgecdn.net/files/7926/606/Immersive%20Vehicles-1.21.1-24.0.0.jar'))
          modrinth('twmdjNBb','pmweather-1.21.1-0.17.14-alpha.jar')
          sable = 'sable-neoforge-1.21.1-2.0.5.jar'
          save(sable, fetch('https://edge.forgecdn.net/files/8673/825/'+sable))
          with zipfile.ZipFile(libs/sable) as z:
              save('sable-companion-common-1.21.1-1.6.0.jar',
                   z.read('META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar'))
          PY
      - name: Build and test stable mod
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean jar check
      - name: Verify release metadata and package matching source
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          jar = pathlib.Path('build/libs/PMWeather-IV-0.12.jar')
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              assert 'version="0.12"' in z.read('META-INF/neoforge.mods.toml').decode()
              assert b'Implementation-Version: 0.12' in z.read('META-INF/MANIFEST.MF')
              assert 'com/g9third/pmweatheriv/client/AutoTrimClient.class' in z.namelist()
              assert 'com/g9third/pmweatheriv/client/WindMonitorVisibility.class' in z.namelist()
              assert not any(x.endswith('.jar') for x in z.namelist())
              assert all('META-INF/licenses/pmweather_iv/'+f in z.namelist()
                         for f in ('LICENSE','COPYING','COPYING.LESSER','THIRD_PARTY_NOTICES.md'))
          PY
          python3 tools/package_source.py --output PMWeather-IV-0.12-public-source.zip
      - name: Save verified wind-HUD patch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PMWeather-IV-0.12-wind-hud
          path: |
            build/libs/PMWeather-IV-0.12.jar
            PMWeather-IV-0.12-public-source.zip
          if-no-files-found: error
          retention-days: 14
      - name: Patch existing stable 0.12 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v0.12 --json isPrerelease --jq '.isPrerelease')" = false
          gh release upload v0.12 \
            build/libs/PMWeather-IV-0.12.jar \
            PMWeather-IV-0.12-public-source.zip \
            --clobber
          gh release edit v0.12 \
            --title 'PMWeather-IV 0.12' \
            --notes-file docs/RELEASE-0.12.md \
            --latest
          git tag -f v0.12 "$GITHUB_SHA"
          git push --force origin refs/tags/v0.12
