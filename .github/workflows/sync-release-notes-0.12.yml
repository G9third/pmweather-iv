name: Sync PMWeather-IV 0.12 release notes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-release-notes-0.12.yml']

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update published release notes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.12 --notes-file docs/RELEASE-0.12.md
