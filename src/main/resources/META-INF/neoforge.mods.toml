[[mods]]
modId="pmweather_iv"
version="0.12.0-rc1"
displayName="PMWeather Immersive Vehicles"
authors="G9third"
description='''
PMWeather-IV connects supported IV ground vehicles, fixed-wing aircraft and rotorcraft
to PMWeather Aeronautics and Sable.
PMAero owns source-native XYZ wind, body pressure and virtual lifting surfaces. Sable owns
rigid-body motion and detailed collisions; IV retains controls, networking and gameplay.
Supported fixed-wing aircraft receive a native elevator-trim-only level-flight assist by default; pilots can disable it per aircraft.
Wind is sampled at force points once per Minecraft tick. Blimps retain IV-native flight.
'''

[[mixins]]
config="pmweather_iv.mixins.json"

